name: SCA Scan Base with Integrity Hash

on:
  workflow_call:
    inputs:
      working-path:
        description: 'The path of the pom.xml'
        required: true
        type: string

      name-of-snyk-step:
        description: 'The name of the job that executes the snyk action'
        required: true
        type: string
    secrets:
      SNYK_TOKEN:
        required: true
      READ_PACKAGE_TOKEN_INPUT:
        description: 'Used for authentication'
        required: true
      USER_FOR_SNYK:
        description: 'Used for authentication'
        required: true

jobs:
  snyk-action:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5
        ports:
          - 26556:5432
        env:
          POSTGRES_DB: integrity_hash
          POSTGRES_USER: coa
          POSTGRES_PASSWORD: the_dodo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

          
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'


    
    - name: Set DB environment variables
      run: |
        echo "INTEGRITY_HASH_DB_USER=coa" >> $GITHUB_ENV
        echo "INTEGRITY_HASH_DB_PASSWORD=the_dodo" >> $GITHUB_ENV

    - name: Build the project
      working-directory: ${{ inputs.working-path }}
      env:
          SPRING_PROFILES_ACTIVE: build
      run: mvn clean install

    - name: Setup Snyk
      uses: snyk/actions/setup@master

    - name: ${{ inputs.name-of-snyk-step }}
      id: snyk-test
      working-directory: ${{ inputs.working-path }}
      run: snyk test
      continue-on-error: false
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
