name: SCA Scan Base Test Postgres

on:
  workflow_call:
    inputs:
      working-path:
        description: 'The path of the pom.xml'
        required: true
        type: string

      integrity_db:
       description: 'Whether to enable database integrity_hash'
       required: false
       default: false
       type: boolean

      name-of-snyk-step:
        description: 'The name of the job that executes the snyk action'
        required: true
        type: string
    secrets:
      SNYK_TOKEN:
        required: true

  

jobs:
  snyk-action:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Conditional step for PostgreSQL service setup and DB environment variables
    - name: Set up services and environment (if integrity_db is true)
      if: ${{ inputs.integrity_db == 'true' }}
      run: |
        docker run -d --name postgres -e POSTGRES_DB=integrity_hash -e POSTGRES_USER=coa -e
        POSTGRES_PASSWORD=the_dodo -p 26556:5432 postgres:17.5
        echo "INTEGRITY_HASH_DB_USER=coa" >> $GITHUB_ENV
        echo "DB_PASSWORD=the_dodo" >> $GITHUB_ENV

     # Conditional step to wait for PostgreSQL service health check (optional)
    - name: Wait for PostgreSQL to be ready
      if: ${{ inputs.integrity_db == 'true' }}
      run: |
        until pg_isready -h localhost -p 5432; do sleep 1; done

    # Conditional step to clean up the service (optional)
    - name: Cleanup PostgreSQL container
      if: ${{ inputs.integrity_db == 'true' }}
      run: |
        docker stop postgres && docker rm postgres
     

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'


    - name: Set up environment variables for accessing the private GitHub package repository
      env:
        GITHUB_TOKEN: ${{ secrets.READ_PACKAGE_TOKEN_FOR_WORKFLOWS_R }}
      run: echo "GITHUB_TOKEN is set to access private packages"


    - name: Setup Maven Settings
      run: |
        mkdir -p ~/.m2
        cat <<EOF > ~/.m2/settings.xml
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
        http://maven.apache.org/xsd/settings-1.0.0.xsd">
        <activeProfiles>
        <activeProfile>github</activeProfile>
        </activeProfiles>
            <profiles>
              <profile>
                  <id>github</id>
                  <repositories>
                    <repository>
                      <id>central</id>
                        <url>https://repo.maven.apache.org/maven2</url>
                      </repository>
                    <repository>
                      <id>github</id>
                      <url>https://maven.pkg.github.com/pwssOrg/literate-octo-guacamole</url>
                      <snapshots>
                        <enabled>true</enabled>
                      </snapshots>
                  </repository>
                </repositories>
          </profile>
        </profiles>
          <servers>
            <server>
              <id>github</id>
              <username>${{ secrets.READ_PACKAGE_TOKEN_FOR_WORKFLOWS_R }}</username>
              <password>${{ secrets.READ_PACKAGE_TOKEN_FOR_WORKFLOWS_R }}</password>
            </server>
          </servers>
        </settings>
        EOF

    - name: Build the project
      working-directory: ${{ inputs.working-path }}
      run: mvn clean install

    - name: Setup Snyk
      uses: snyk/actions/setup@master

    - name: ${{ inputs.name-of-snyk-step }}
      id: snyk-test
      working-directory: ${{ inputs.working-path }}
      run: snyk test
      continue-on-error: false
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
